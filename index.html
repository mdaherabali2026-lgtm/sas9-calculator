<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#17191b">
<title>SAS9 1654X — Advanced Electronic Calculator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow-x:hidden}
body{
  font-family:Arial,Helvetica,sans-serif;
  display:flex;justify-content:center;align-items:center;
  padding:8px 6px;
  background:radial-gradient(circle at 50% 50%,#292b2e 0,#111 100%);
  color:#eee;
}
button,input,select,textarea{font:inherit}
button{user-select:none}
.calc{
  width:min(980px,100%);
  position:relative;
  padding:12px 14px 20px;
  border-radius:26px;
  background:linear-gradient(#101112 0 31.5%,#090a0b 32%,#e1e1df 32.3%,#b7b8b7 100%);
  border:3px solid #080808;
  box-shadow:0 25px 60px #000c,0 2px 0 #777,inset 0 1px 0 #777;
}
.calc:before{
  content:"";position:absolute;inset:7px;border-radius:20px;
  border:1px solid #fff2;pointer-events:none
}
.head{
  height:102px;display:grid;grid-template-columns:1fr auto auto 1fr;
  align-items:center;padding:0 20px;gap:14px
}
.brand{font-size:43px;font-weight:900;letter-spacing:4px;text-shadow:0 2px 2px #000}
.brand span{display:block;font-size:8px;letter-spacing:3px;margin-top:-5px;color:#aaa}
.model{text-align:center;font-size:11px;font-weight:bold;color:#ddd;line-height:1.2}
.model b{font-size:18px;display:block}

/* Sound Toggle Button */
.sound-toggle{
  background:#1a1c1e;
  border:2px solid #090909;
  border-radius:8px;
  color:#e4c244;
  cursor:pointer;
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:inset 0 1px 3px #000,0 1px 0 #666;
  transition:all .15s ease;
}
.sound-toggle:active{transform:scale(0.95)}
.sound-toggle svg{width:22px;height:22px;fill:currentColor}
.sound-toggle.muted{color:#777}

.solar{
  justify-self:end;width:150px;height:42px;border-radius:4px;
  border:2px solid #090909;
  background:
    repeating-linear-gradient(90deg,#24272a 0 39px,#4c4f52 40px 80px);
  box-shadow:inset 0 2px 5px #000,0 1px 0 #666
}
.screen-shell{
  margin:0 28px 11px;padding:13px 17px 17px;
  background:#e9e9e7;border-radius:17px;
  box-shadow:inset 0 2px 5px #777,0 2px 0 #090909
}
.lcd{
  height:128px;border:2px solid #696c69;border-radius:5px;
  background:
    repeating-linear-gradient(0deg,#00000008 0 2px,#fff1 3px 4px),
    linear-gradient(#d9ddd4,#afb6ad);
  color:#182018;padding:7px 13px;
  box-shadow:inset 0 4px 9px #0005,inset 0 -1px #fff;
  overflow:hidden
}
.lcd-info{height:19px;font:11px monospace;display:flex;gap:18px;opacity:.75}
.lcd-note{height:17px;text-align:right;font:12px monospace;white-space:nowrap;overflow:hidden}
.lcd-value{
  height:69px;text-align:right;overflow-x:auto;scrollbar-width:none;
  white-space:nowrap;font:clamp(38px,7vw,67px)/1.1 "Courier New",monospace;
  letter-spacing:1px
}
.lcd-value::-webkit-scrollbar{display:none}
.switches{
  margin:0 30px 10px;display:grid;grid-template-columns:1fr 1fr;gap:28px;
}
.sw-label{font-size:8px;color:#333;font-weight:900;letter-spacing:.5px;margin:0 0 2px 10px}
.sw-track{
  height:43px;border:2px solid #858585;border-radius:9px;
  background:linear-gradient(#a4a5a6,#eee 45%,#a1a2a3);
  box-shadow:inset 0 2px 5px #555,0 1px 0 #fff;
  display:flex;align-items:center;justify-content:space-between;padding:4px 8px;
  color:#242424;font-size:8px;font-weight:900
}
.slider{
  width:52px;height:32px;appearance:none;border:1px solid #111;border-radius:6px;
  background:linear-gradient(90deg,#08090a,#333,#090a0b);
  position:relative;box-shadow:0 2px 3px #222
}
.slider:before{
  content:"";position:absolute;width:19px;height:25px;top:2px;left:3px;
  border-radius:4px;background:linear-gradient(#6a6b6d,#191a1b);
  box-shadow:1px 2px 2px #000;transition:.12s
}
.slider:checked:before{left:28px}

.keypad{
  padding:0 27px;display:grid;grid-template-columns:repeat(6,1fr);
  grid-auto-rows:minmax(62px,auto);gap:10px
}
.key{
  border:1px solid #090a0a;border-radius:11px;min-height:62px;
  background:linear-gradient(#626467,#414347 42%,#27292c);
  color:#f3f3f3;font-size:clamp(17px,3vw,29px);font-weight:900;
  text-shadow:0 2px 1px #000;
  box-shadow:0 5px 0 #090a0b,0 8px 8px #0007,inset 0 1px 1px #9a9b9c;
  transition:transform .055s,box-shadow .055s,filter .1s
}
.key:active,.key.pressed{
  transform:translateY(5px);
  box-shadow:0 1px 0 #090a0b,0 2px 4px #0008,inset 0 2px 3px #111
}
.key.black{background:linear-gradient(#36383b,#121315);font-size:15px}
.key.pink{background:linear-gradient(#c33360,#791234)}
.key.yellow{color:#e3bd29;font-size:13px}
.key.op{background:linear-gradient(#35383b,#111214)}
.key.tall{grid-row:span 2}
.key.eq{grid-row:span 2}
.tools{
  display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:11px 27px 0
}
.tool{
  min-height:36px;border:1px solid #666;border-radius:7px;
  background:linear-gradient(#eee,#9d9e9f);color:#222;font-weight:900;font-size:9px;
  box-shadow:0 3px 0 #555
}
.tool:active{transform:translateY(2px);box-shadow:0 1px #555}
.footer{padding:12px 29px 0;color:#222;font-size:8px;font-weight:bold;display:flex;justify-content:space-between}

/* feature drawer */
.drawer{
  position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:20
}
.drawer.open{display:flex}
.panel{
  width:min(980px,100%);max-height:88vh;overflow:auto;
  background:linear-gradient(#292b2e,#111315);
  border:2px solid #777;border-bottom:0;border-radius:21px 21px 0 0;
  padding:16px;box-shadow:0 -20px 70px #000
}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.panel-head h2{margin:0;font-size:19px}
.close{background:linear-gradient(#7e2147,#4f0d29);color:#fff;border:1px solid #111;border-radius:7px;padding:8px 13px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:#181a1d;border:1px solid #555;border-radius:10px;padding:12px;box-shadow:inset 0 1px #777}
.card h3{margin:0 0 8px;color:#e4c244;font-size:14px}
.card label{display:block;font-size:10px;color:#bbb;margin:6px 0 3px}
.card input,.card select,.card textarea{
  width:100%;padding:8px;border-radius:6px;border:1px solid #555;
  background:#0c0d0f;color:#fff
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.action{
  width:100%;margin-top:8px;padding:9px;border-radius:7px;border:1px solid #111;
  color:#fff;font-weight:900;background:linear-gradient(#66686b,#292b2e);
  box-shadow:0 3px #080808
}
.action:active{transform:translateY(2px);box-shadow:0 1px #080808}
.out{margin-top:8px;padding:9px;background:#bac2b2;color:#172017;border-radius:5px;font:700 13px monospace;min-height:34px}
.history{max-height:50vh;overflow:auto}
.hitem{display:flex;justify-content:space-between;gap:10px;padding:9px;border-bottom:1px solid #444}
.hitem small{display:block;color:#999;margin-top:3px}
.danger{background:linear-gradient(#a4234f,#5e0e2d)!important}
.toast{
  position:fixed;z-index:100;left:50%;bottom:20px;transform:translate(-50%,20px);
  opacity:0;background:#17191c;border:1px solid #777;border-radius:8px;padding:9px 14px;transition:.2s
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:650px){
 body{padding:6px 4px calc(8px + env(safe-area-inset-bottom, 0px));align-items:center;justify-content:center}
 .calc{width:100%;border-radius:20px;padding:8px 6px 12px;display:flex;flex-direction:column}
 .head{height:60px;flex:0 0 60px;padding:0 6px;gap:5px}.brand{font-size:23px;letter-spacing:1px}.brand span{font-size:6px;letter-spacing:1px}
 .model{font-size:7px}.model b{font-size:12px}
 .sound-toggle{width:32px;height:32px}.sound-toggle svg{width:16px;height:16px}
 .solar{width:50px;height:24px}
 .screen-shell{margin:0 4px 8px;padding:8px 10px 10px;flex:0 0 auto}.lcd{height:95px;padding:6px 10px}.lcd-value{font-size:32px;height:48px}
 .switches{margin:0 6px 8px;gap:8px;flex:0 0 auto}.sw-label{font-size:7px}.sw-track{height:32px;padding:2px 6px;font-size:7px}.slider{width:40px;height:24px}.slider:before{width:15px;height:18px}.slider:checked:before{left:21px}
 .keypad{padding:0 4px;gap:6px;grid-auto-rows:minmax(50px,auto);flex:0 0 auto}.key{min-height:50px;border-radius:9px;font-size:17px}.key.black{font-size:10px}.key.yellow{font-size:8px}
 .tools{margin:8px 4px 0;gap:6px;grid-template-columns:repeat(3,1fr);flex:0 0 auto}.tool{min-height:34px;font-size:8.5px;border-radius:6px}
 .footer{padding:6px 6px 0;font-size:7px;flex:0 0 auto}
 .grid{grid-template-columns:1fr}
}

.keypad,.tools,.switches{user-select:none}
</style>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SAS9 1654X">
</head>
<body>
<div class="calc">

<header class="head">
  <div class="brand">SAS9<span>ADVANCED ELECTRONIC CALCULATOR</span></div>
  <div class="model"><b>1654X</b>12 DIGITS<br>TWO POWER</div>
  <button class="sound-toggle" id="soundBtn" aria-label="Toggle Sound" title="Sound ON/OFF">
    <svg id="soundIcon" viewBox="0 0 24 24">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
  </button>
  <div class="solar" aria-label="solar panel"></div>
</header>

<section class="screen-shell">
  <div class="lcd">
    <div class="lcd-info"><span id="mode">CALC</span><span id="angle">DEG</span><span id="mem"></span></div>
    <div class="lcd-note" id="note">&nbsp;</div>
    <div class="lcd-value" id="screen">0</div>
  </div>
</section>

<section class="switches">
  <div>
    <div class="sw-label">5/4 • ROUNDING</div>
    <div class="sw-track">
      <span>5/4</span><input id="roundSwitch" class="slider" type="checkbox"><span>F</span>
    </div>
  </div>
  <div>
    <div class="sw-label">ADD2  4  3  2  0  F</div>
    <div class="sw-track">
      <span>ADD2</span><input id="floatSwitch" class="slider" type="checkbox" checked><span>F</span>
    </div>
  </div>
</section>

<main class="keypad">
  <button class="key black yellow" data-act="mu">MU</button>
  <button class="key black" data-act="mp">M+</button>
  <button class="key black" data-act="mm">M−</button>
  <button class="key black" data-act="mr">MRC</button>
  <button class="key black yellow" data-act="checkup">▲<br>CHECK</button>
  <button class="key black yellow" data-act="checkdown">▼<br>CHECK</button>

  <button class="key black" data-act="gt">GT</button>
  <button class="key" data-v="7">7</button>
  <button class="key" data-v="8">8</button>
  <button class="key" data-v="9">9</button>
  <button class="key black" data-act="percent">%</button>
  <button class="key black" data-v="√(">√</button>

  <button class="key black" data-act="sign">+/−</button>
  <button class="key" data-v="4">4</button>
  <button class="key" data-v="5">5</button>
  <button class="key" data-v="6">6</button>
  <button class="key black" data-v="×">×</button>
  <button class="key black" data-v="÷">÷</button>

  <button class="key pink" data-act="clear">ON<br><small>AC</small></button>
  <button class="key" data-v="1">1</button>
  <button class="key" data-v="2">2</button>
  <button class="key" data-v="3">3</button>
  <button class="key op tall" data-v="+">+</button>
  <button class="key black" data-act="minus">−</button>

  <button class="key pink" data-act="ce">CE</button>
  <button class="key wide" data-v="0">0</button>
  <button class="key" data-v="00">00</button>
  <button class="key" data-v=".">.</button>
  <button class="key black" data-act="equals">=</button>
</main>

<nav class="tools">
  <button class="tool" data-open="scientific">SCIENTIFIC</button>
  <button class="tool" data-open="converter">CONVERTER</button>
  <button class="tool" data-open="finance">LOAN / EMI</button>
  <button class="tool" data-open="business">BUSINESS</button>
  <button class="tool" data-open="algebra">ALGEBRA</button>
  <button class="tool" data-open="history">HISTORY</button>
</nav>
<div class="footer"><span>SAS9 • 1654X</span><span>SOLAR + BATTERY • LOCAL</span></div>
</div>

<div class="drawer" id="drawer">
 <div class="panel">
  <div class="panel-head"><h2 id="ptitle">FEATURE</h2><button class="close" onclick="closePanel()">CLOSE</button></div>
  <div id="pbody"></div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
let exp="",ans=0,mem=0,gt=0,rad=false,floating=true,round=false;
let soundOn = localStorage.getItem("sas9_sound") !== "false";
let hist=JSON.parse(localStorage.getItem("sas9_hist")||"[]");

// Audio Synthesizer (Click Sound Engine)
let audioCtx = null;
function playClickSound(freq = 600, duration = 0.03) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + duration);
    
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

const soundBtn = document.getElementById("soundBtn");
const soundIcon = document.getElementById("soundIcon");

const iconOn = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
const iconOff = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';

function updateSoundUI() {
  if (soundOn) {
    soundBtn.classList.remove("muted");
    soundIcon.innerHTML = iconOn;
  } else {
    soundBtn.classList.add("muted");
    soundIcon.innerHTML = iconOff;
  }
}

soundBtn.addEventListener("click", () => {
  soundOn = !soundOn;
  localStorage.setItem("sas9_sound", soundOn);
  updateSoundUI();
  if (soundOn) playClickSound(800, 0.05);
});
updateSoundUI();

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const screen=$("#screen");
function render(){screen.textContent=exp||"0";$("#angle").textContent=rad?"RAD":"DEG";$("#mem").textContent=mem?"M":""}
function toast(x){let t=$("#toast");t.textContent=x;t.classList.add("on");clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove("on"),1300)}
function safe(s){return s.replaceAll("×","*").replaceAll("÷","/").replaceAll("−","-")}
function fact(n){if(n<0||n>170||n%1)return NaN;let r=1;for(let i=2;i<=n;i++)r*=i;return r}
function evaluate(s){
 s=safe(s).replace(/\^/g,"**").replace(/(\d+(?:\.\d+)?)%/g,"($1/100)");
 if(!/^[0-9+\-*/().,^A-Za-z_]+$/.test(s))throw 0;
 const F={
  sin:x=>Math.sin(rad?x:x*Math.PI/180),cos:x=>Math.cos(rad?x:x*Math.PI/180),
  tan:x=>Math.tan(rad?x:x*Math.PI/180),sqrt:Math.sqrt,log:Math.log10,ln:Math.log,
  abs:Math.abs,fact,asin:x=>rad?Math.asin(x):Math.asin(x)*180/Math.PI,
  acos:x=>rad?Math.acos(x):Math.acos(x)*180/Math.PI,
  atan:x=>rad?Math.atan(x):Math.atan(x)*180/Math.PI
 };
 s=s.replace(/\bπ\b/g,"Math.PI").replace(/\be\b/g,"Math.E");
 Object.keys(F).forEach(n=>s=s.replace(new RegExp("\\b"+n+"\\s*\\(","g"),"F."+n+"("));
 return Function("F","Math","return ("+s+")")(F,Math);
}
function fmt(n){
 if(!Number.isFinite(n))return "Error";
 if(round)return String(Math.round(n));
 return Number(n.toPrecision(12)).toLocaleString("en-US",{useGrouping:false,maximumFractionDigits:floating?12:2});
}
function ins(v){if(exp==="Error")exp="";exp+=v;render()}
function clear(){exp="";$("#note").innerHTML="&nbsp;";render()}
function ce(){exp=exp==="Error"?"":exp.slice(0,-1);render()}
function equal(){
 try{
  let old=exp,r=evaluate(exp);ans=r;gt+=r;exp=fmt(r);$("#note").textContent=old+" =";
  hist.unshift({e:old,r:exp,t:new Date().toLocaleString()});hist=hist.slice(0,100);
  localStorage.setItem("sas9_hist",JSON.stringify(hist));render();toast("RESULT")
 }catch{exp="Error";$("#note").textContent="ERROR";render();setTimeout(clear,850)}
}
function sign(){if(!exp)return;if(/^-?\d+(\.\d+)?$/.test(exp))exp=String(-Number(exp));else exp="(-1×("+exp+"))";render()}
function percent(){try{exp=fmt(evaluate(exp)/100);render()}catch{toast("INVALID")}}
function memoryAdd(){try{mem+=evaluate(exp);toast("M+")}catch{}render()}
function memoryMinus(){try{mem-=evaluate(exp);toast("M−")}catch{}render()}
function memoryRecall(){exp=fmt(mem);render()}
function grand(){exp=fmt(gt);render()}
function mu(){
 try{
  let x=evaluate(exp);exp=fmt(x*1.1);$("#note").textContent="MU +10%";render()
 }catch{toast("ENTER VALUE")}
}
function check(dir){
 if(!hist.length){toast("NO CHECK DATA");return}
 let i=Number($("#screen").dataset.h||0)+dir;
 i=Math.max(0,Math.min(hist.length-1,i));$("#screen").dataset.h=i;exp=hist[i].r;$("#note").textContent="CHECK "+(i+1)+"/"+hist.length;render()
}

$$(".key").forEach(k=>{
 k.addEventListener("click",()=>{
  playClickSound(k.classList.contains("pink") ? 750 : k.classList.contains("op") ? 680 : 520);
  k.classList.add("pressed");setTimeout(()=>k.classList.remove("pressed"),90);
  let v=k.dataset.v,a=k.dataset.act;
  if(v!==undefined){ins(v);return}
  if(a==="equals")equal();else if(a==="clear")clear();else if(a==="ce")ce();
  else if(a==="sign")sign();else if(a==="percent")percent();
  else if(a==="mp")memoryAdd();else if(a==="mm")memoryMinus();else if(a==="mr")memoryRecall();
  else if(a==="gt")grand();else if(a==="mu")mu();else if(a==="checkup")check(-1);else if(a==="checkdown")check(1);
 })
});
$("#floatSwitch").onchange=e=>{playClickSound(450);floating=e.target.checked;render()};
$("#roundSwitch").onchange=e=>{playClickSound(450);round=e.target.checked;render()};

document.addEventListener("keydown",e=>{
 playClickSound(550);
 if(e.key==="Enter")equal();else if(e.key==="Backspace")ce();else if(e.key==="Escape")clear();
 else if(/[0-9.+\-*/()^]/.test(e.key))ins(e.key);
});

function openPanel(type){
 playClickSound(700);
 $("#drawer").classList.add("open");
 let title="",body="";
 if(type==="scientific"){
  title="SCIENTIFIC ENGINE";
  body=`<div class="grid">
   <div class="card"><h3>TRIG / LOG / ROOT</h3>
   <p>Use the physical calculator keys and type expressions such as <b>sin(30)</b>, <b>log(1000)</b>, <b>sqrt(144)</b>.</p>
   <div class="row"><button class="action" onclick="playClickSound(600);ins('sin(')">SIN</button><button class="action" onclick="playClickSound(600);ins('cos(')">COS</button></div>
   <div class="row"><button class="action" onclick="playClickSound(600);ins('tan(')">TAN</button><button class="action" onclick="playClickSound(600);ins('π')">π</button></div></div>
   <div class="card"><h3>ADVANCED</h3><p>Power: <b>2^10</b> • Factorial: <b>fact(5)</b> • inverse trig and absolute value are supported.</p>
   <div class="row"><button class="action" onclick="playClickSound(600);ins('fact(')">n!</button><button class="action" onclick="playClickSound(600);ins('abs(')">ABS</button></div></div>
  </div>`;
 }
 if(type==="converter"){
  title="UNIT / CURRENCY CONVERTER";
  body=`<div class="card"><h3>CONVERSION DESK</h3>
   <label>Category</label><select id="cat" onchange="fillUnits()"><option>length</option><option>mass</option><option>area</option><option>volume</option><option>speed</option><option>temperature</option><option>currency</option></select>
   <div class="row"><div><label>From</label><select id="from"></select></div><div><label>To</label><select id="to"></select></div></div>
   <label>Value</label><input id="cv" type="number" value="1">
   <button class="action" onclick="playClickSound(650);convert()">CONVERT</button><div class="out" id="co">—</div>
   <p>Currency rates are built-in reference rates for offline use; they are not live market rates.</p></div>`;
 }
 if(type==="finance"){
  title="LOAN / EMI CALCULATOR";
  body=`<div class="card"><h3>MONTHLY PAYMENT</h3>
   <label>Principal</label><input id="lp" type="number" value="100000">
   <div class="row"><div><label>Annual interest %</label><input id="lr" type="number" value="8"></div><div><label>Months</label><input id="ln" type="number" value="60"></div></div>
   <button class="action" onclick="playClickSound(650);emi()">CALCULATE EMI</button><div class="out" id="eo">—</div></div>`;
 }
 if(type==="business"){
  title="BUSINESS CALCULATOR";
  body=`<div class="card"><h3>PROFIT • VAT • DISCOUNT</h3>
   <label>Cost price</label><input id="bc" type="number" value="100">
   <label>Selling price</label><input id="bs" type="number" value="125">
   <div class="row"><div><label>VAT %</label><input id="bv" type="number" value="15"></div><div><label>Discount %</label><input id="bd" type="number" value="10"></div></div>
   <button class="action" onclick="playClickSound(650);biz()">CALCULATE</button><div class="out" id="bo">—</div></div>`;
 }
 if(type==="algebra"){
  title="ALGEBRA SOLVER";
  body=`<div class="card"><h3>ax² + bx + c = 0</h3>
   <div class="row"><input id="qa" type="number" value="1" placeholder="a"><input id="qb" type="number" value="-5" placeholder="b"></div>
   <input id="qc" type="number" value="6" placeholder="c" style="margin-top:7px">
   <button class="action" onclick="playClickSound(650);quad()">SOLVE</button><div class="out" id="qo">—</div></div>`;
 }
 if(type==="history"){
  title="CALCULATION HISTORY";
  body=`<div class="card"><h3>CHECK / REPLAY</h3><div class="history">${hist.length?hist.map((x,i)=>`<div class="hitem"><div><b>${esc(x.e)}</b><small>${esc(x.t)}</small></div><b>${esc(x.r)}</b></div>`).join(""):"<p>No saved calculations.</p>"}</div><button class="action danger" onclick="playClickSound(400);clearHist()">CLEAR HISTORY</button></div>`;
 }
 $("#ptitle").textContent=title;$("#pbody").innerHTML=body;if(type==="converter")fillUnits();
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
window.openPanel=openPanel;
window.closePanel=()=>{playClickSound(450);$("#drawer").classList.remove("open");};
window.clearHist=()=>{hist=[];localStorage.removeItem("sas9_hist");closePanel();toast("HISTORY CLEARED")};

const units={
 length:{m:1,cm:.01,mm:.001,km:1000,in:.0254,ft:.3048,yd:.9144,mi:1609.344},
 mass:{kg:1,g:.001,mg:.000001,lb:.45359237,oz:.028349523125},
 area:{m2:1,cm2:.0001,km2:1e6,ft2:.09290304,acre:4046.8564224,ha:10000},
 volume:{L:1,mL:.001,m3:1000,gal:3.785411784,qt:.946352946,pint:.473176473,cup:.2365882365},
 speed:{"m/s":1,"km/h":.2777777778,mph:.44704,"ft/s":.3048},
 currency:{USD:1,EUR:.86,GBP:.74,SAR:3.75,BDT:122,INR:83,JPY:156,AED:3.6725}
};
window.fillUnits=()=>{
 let c=$("#cat").value,a=c==="temperature"?["C","F","K"]:Object.keys(units[c]);
 $("#from").innerHTML=a.map(x=>`<option>${x}</option>`).join("");$("#to").innerHTML=a.map(x=>`<option>${x}</option>`).join("")
};
window.convert=()=>{
 let c=$("#cat").value,a=$("#from").value,b=$("#to").value,v=+$("#cv").value,r;
 if(c==="temperature"){let C=a==="C"?v:a==="F"?(v-32)*5/9:v-273.15;r=b==="C"?C:b==="F"?C*9/5+32:C+273.15}
 else r=v*units[c][a]/units[c][b];
 $("#co").textContent=fmt(r)+" "+b
};
window.emi=()=>{
 let P=+$("#lp").value,r=+$("#lr").value/1200,n=+$("#ln").value,m=r?P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):P/n;
 $("#eo").innerHTML=`Monthly EMI: ${fmt(m)}<br>Total payment: ${fmt(m*n)}<br>Total interest: ${fmt(m*n-P)}`
};
window.biz=()=>{
 let c=+$("#bc").value,s=+$("#bs").value,v=+$("#bv").value,d=+$("#bd").value,p=s-c;
 $("#bo").innerHTML=`Profit/Loss: ${fmt(p)}<br>Markup: ${fmt(c?p/c*100:0)}%<br>Margin: ${fmt(s?p/s*100:0)}%<br>Discounted: ${fmt(s*(1-d/100))}<br>VAT: ${fmt(s*(1-d/100)*v/100)}`
};
window.quad=()=>{
 let a=+$("#qa").value,b=+$("#qb").value,c=+$("#qc").value,d=b*b-4*a*c;
 if(a===0){$("#qo").textContent=b?"x = "+fmt(-c/b):(c?"No solution":"All real numbers");return}
 if(d>=0)$("#qo").innerHTML=`x₁ = ${fmt((-b+Math.sqrt(d))/(2*a))}<br>x₂ = ${fmt((-b-Math.sqrt(d))/(2*a))}<br>Δ = ${fmt(d)}`;
 else{$("#qo").innerHTML=`x₁ = ${fmt(-b/(2*a))} + ${fmt(Math.sqrt(-d)/(2*Math.abs(a)))}i<br>x₂ = ${fmt(-b/(2*a))} − ${fmt(Math.sqrt(-d)/(2*Math.abs(a)))}i`}
};

$$(".tool").forEach(b=>b.onclick=()=>openPanel(b.dataset.open));
render();
})();
</script>
